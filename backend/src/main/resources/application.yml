spring:
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mariadb://localhost:3306/flowlyrent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Paris
    username: ${DB_USERNAME:flowlyrent}
    password: ${DB_PASSWORD:flowlyrent}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Paris
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  price:
    starter: ${STRIPE_PRICE_STARTER:}
    pro: ${STRIPE_PRICE_PRO:}
    agence: ${STRIPE_PRICE_AGENCE:}

jwt:
  # Obligatoire en production : variable d'environnement JWT_SECRET (base64, minimum 32 octets)
  secret: ${JWT_SECRET:ZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLXBsZWFzZS1jaGFuZ2U=}
  expiration: ${JWT_EXPIRATION:604800000}  # 7 jours en ms

app:
  name: ${APP_NAME:FlowlyRent}
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:3000"
  analytics:
    internal-emails: ${ANALYTICS_INTERNAL_EMAILS:}
  encryption:
    # Clé AES-256 encodée en Base64 (32 octets). Obligatoire en prod : variable ENCRYPTION_KEY.
    # En dev : générer avec : openssl rand -base64 32
    key: ${ENCRYPTION_KEY:}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:BMGk0cSh1FZP3Kewk15rq8j8xujMfalgOhsvXL2FHj-3klTBSWlFlXYiJWd8j3bmSARKsfHv3s_DyFiqm2U4DKQ}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:contact@flowlyrent.com}

firebase:
  # Contenu JSON complet du compte de service Firebase Admin (Project Settings > Service accounts > Generate new private key)
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

gemini:
  # Clé API Google Gemini (https://aistudio.google.com/app/apikey) — utilisée par le chatbot FAQ
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

groq:
  # Clé API Groq (https://console.groq.com/keys) — utilisée comme repli (fallback) du chatbot FAQ
  # si Gemini est indisponible (ex. quota dépassé)
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dlixzbkue}
  api-key: ${CLOUDINARY_API_KEY:636556719395733}
  api-secret: ${CLOUDINARY_SECRET}

sync:
  ical:
    cron: "0 0 */2 * * *"

logging:
  level:
    com.flowlyrent: DEBUG
    org.hibernate.SQL: WARN
